<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg_atomic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1624" />
      <stop offset="50%" stop-color="#152238" />
      <stop offset="100%" stop-color="#090E17" />
    </linearGradient>
    <linearGradient id="orbit_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE28A" />
      <stop offset="50%" stop-color="#F2D78A" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>

  <rect width="400" height="600" rx="12" fill="url(#bg_atomic)" />
  <rect x="0" y="0" width="28" height="600" fill="#000000" opacity="0.3" />
  <rect x="42" y="30" width="326" height="540" rx="4" fill="none" stroke="url(#orbit_gold)" stroke-width="1.5" opacity="0.5" />

  <!-- Atomic Orbital Rings -->
  <g transform="translate(205, 220)">
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="url(#orbit_gold)" stroke-width="1.5" transform="rotate(30)" opacity="0.7" />
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="url(#orbit_gold)" stroke-width="1.5" transform="rotate(-30)" opacity="0.7" />
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="url(#orbit_gold)" stroke-width="1.5" transform="rotate(90)" opacity="0.7" />
    <circle cx="0" cy="0" r="10" fill="url(#orbit_gold)" />
    <!-- Electron Dots -->
    <circle cx="48" cy="28" r="3" fill="#FFF8E1" />
    <circle cx="-48" cy="28" r="3" fill="#FFF8E1" />
    <circle cx="0" cy="-55" r="3" fill="#FFF8E1" />
  </g>

  <!-- Author Name -->
  <text x="205" y="105" font-family="'Inter', sans-serif" font-size="12" fill="#F2D78A" letter-spacing="4" text-anchor="middle" font-weight="600">
    JAMES CLEAR
  </text>
  <line x1="150" y1="120" x2="260" y2="120" stroke="url(#orbit_gold)" stroke-width="1" opacity="0.5" />

  <!-- Book Title -->
  <text x="205" y="340" font-family="'Inter', sans-serif" font-size="28" fill="#FFF8E1" letter-spacing="3" text-anchor="middle" font-weight="800">
    ATOMIC HABITS
  </text>

  <!-- Subtitle -->
  <text x="205" y="380" font-family="'Inter', sans-serif" font-size="10" fill="#CFC5B5" letter-spacing="2" text-anchor="middle" opacity="0.8">
    TINY CHANGES, REMARKABLE RESULTS
  </text>

  <line x1="160" y1="480" x2="250" y2="480" stroke="url(#orbit_gold)" stroke-width="1" opacity="0.5" />
  <text x="205" y="515" font-family="'Inter', sans-serif" font-size="9" fill="#F2D78A" letter-spacing="3" text-anchor="middle" opacity="0.8">
    COMPOUND PERSONAL GROWTH
  </text>
</svg>
