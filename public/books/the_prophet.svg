<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg_prophet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#070D12" />
    </linearGradient>
    <linearGradient id="gold_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="50%" stop-color="#F2D78A" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Book Cover Background -->
  <rect width="400" height="600" rx="12" fill="url(#bg_prophet)" />

  <!-- Book Spine Embossing -->
  <rect x="0" y="0" width="28" height="600" fill="#000000" opacity="0.35" />
  <line x1="28" y1="0" x2="28" y2="600" stroke="url(#gold_grad)" stroke-width="1.5" opacity="0.4" />

  <!-- Ornamental Outer Border -->
  <rect x="42" y="30" width="326" height="540" rx="6" fill="none" stroke="url(#gold_grad)" stroke-width="1.5" opacity="0.6" />
  <rect x="48" y="36" width="314" height="528" rx="4" fill="none" stroke="url(#gold_grad)" stroke-width="0.75" opacity="0.3" stroke-dasharray="4,4" />

  <!-- Corner Flourishes -->
  <circle cx="42" cy="30" r="3" fill="#F2D78A" />
  <circle cx="368" cy="30" r="3" fill="#F2D78A" />
  <circle cx="42" cy="570" r="3" fill="#F2D78A" />
  <circle cx="368" cy="570" r="3" fill="#F2D78A" />

  <!-- Celestial Ship / Wing Emblem -->
  <g transform="translate(205, 230)" filter="url(#glow)">
    <!-- Crescent Moon / Boat of Almustafa -->
    <path d="M-60,-20 C-30,50 30,50 60,-20 C35,25 -35,25 -60,-20 Z" fill="url(#gold_grad)" opacity="0.9" />
    <!-- Guiding Star -->
    <polygon points="0,-75 6,-50 30,-50 10,-35 18,-10 0,-25 -18,-10 -10,-35 -30,-50 -6,-50" fill="url(#gold_grad)" opacity="0.95" />
    <circle cx="0" cy="-45" r="2" fill="#FFFFFF" />
  </g>

  <!-- Author Name -->
  <text x="205" y="110" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="14" fill="#F2D78A" letter-spacing="6" text-anchor="middle" font-weight="600" opacity="0.9">
    KAHLIL GIBRAN
  </text>
  <line x1="140" y1="125" x2="270" y2="125" stroke="url(#gold_grad)" stroke-width="1" opacity="0.5" />

  <!-- Book Title -->
  <text x="205" y="360" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="34" fill="#FFF8E1" letter-spacing="3" text-anchor="middle" font-weight="700">
    THE PROPHET
  </text>

  <!-- Subtitle -->
  <text x="205" y="400" font-family="'Inter', sans-serif" font-size="11" fill="#CFC5B5" letter-spacing="3" text-anchor="middle" opacity="0.8">
    ON LOVE, WORK, FREEDOM &amp; JOY
  </text>

  <!-- Bottom Classic Seal -->
  <line x1="160" y1="480" x2="250" y2="480" stroke="url(#gold_grad)" stroke-width="1" opacity="0.5" />
  <text x="205" y="515" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="9" fill="#F2D78A" letter-spacing="4" text-anchor="middle" opacity="0.75">
    A CLASSIC OF TIMELESS WISDOM
  </text>
</svg>
