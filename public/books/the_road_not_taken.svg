<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg_road" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2319" />
      <stop offset="50%" stop-color="#183627" />
      <stop offset="100%" stop-color="#07110C" />
    </linearGradient>
    <linearGradient id="forest_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D78A" />
      <stop offset="100%" stop-color="#7CA982" />
    </linearGradient>
  </defs>

  <rect width="400" height="600" rx="12" fill="url(#bg_road)" />
  <rect x="0" y="0" width="28" height="600" fill="#000000" opacity="0.35" />
  <rect x="42" y="30" width="326" height="540" rx="4" fill="none" stroke="url(#forest_gold)" stroke-width="1.5" opacity="0.6" />

  <!-- Diverging Path Emblem in Yellow Wood -->
  <g transform="translate(205, 220)">
    <path d="M0,70 L0,10 Q-30,-20 -60,-50 M0,10 Q30,-20 60,-50" fill="none" stroke="url(#forest_gold)" stroke-width="3" stroke-linecap="round" />
    <circle cx="-60" cy="-50" r="4" fill="#F2D78A" />
    <circle cx="60" cy="-50" r="3" fill="#CFC5B5" opacity="0.5" />
    <!-- Autumn Leaves -->
    <path d="M-15,25 Q-25,15 -15,5 Q-5,15 -15,25" fill="#F2D78A" opacity="0.7" />
    <path d="M20,35 Q30,25 20,15 Q10,25 20,35" fill="#F2D78A" opacity="0.5" />
  </g>

  <!-- Author Name -->
  <text x="205" y="105" font-family="'Playfair Display', 'Georgia', serif" font-size="13" fill="#F2D78A" letter-spacing="4" text-anchor="middle" font-weight="600">
    ROBERT FROST
  </text>
  <line x1="140" y1="120" x2="270" y2="120" stroke="url(#forest_gold)" stroke-width="1" opacity="0.5" />

  <!-- Book Title -->
  <text x="205" y="335" font-family="'Playfair Display', serif" font-size="28" fill="#FFF8E1" letter-spacing="2" text-anchor="middle" font-weight="700">
    THE ROAD
  </text>
  <text x="205" y="375" font-family="'Playfair Display', serif" font-size="24" fill="#F2D78A" letter-spacing="2" text-anchor="middle" font-weight="600">
    NOT TAKEN
  </text>

  <!-- Subtitle -->
  <text x="205" y="415" font-family="'Inter', sans-serif" font-size="10" fill="#CFC5B5" letter-spacing="2" text-anchor="middle" opacity="0.8">
    AND OTHER POEMS
  </text>

  <line x1="160" y1="480" x2="250" y2="480" stroke="url(#forest_gold)" stroke-width="1" opacity="0.5" />
  <text x="205" y="515" font-family="'Cinzel', serif" font-size="9" fill="#F2D78A" letter-spacing="3" text-anchor="middle" opacity="0.8">
    THE PATH LESS TRAVELED
  </text>
</svg>
