<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg_med" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1412" />
      <stop offset="50%" stop-color="#261E1A" />
      <stop offset="100%" stop-color="#0E0A08" />
    </linearGradient>
    <linearGradient id="bronze_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D78A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C6D23" />
    </linearGradient>
  </defs>

  <!-- Cover Body -->
  <rect width="400" height="600" rx="12" fill="url(#bg_med)" />

  <!-- Leather Spine -->
  <rect x="0" y="0" width="28" height="600" fill="#000000" opacity="0.4" />
  <line x1="28" y1="0" x2="28" y2="600" stroke="url(#bronze_gold)" stroke-width="1.5" opacity="0.5" />

  <!-- Stoic Roman Double Border -->
  <rect x="42" y="30" width="326" height="540" rx="4" fill="none" stroke="url(#bronze_gold)" stroke-width="2" opacity="0.7" />
  <rect x="50" y="38" width="310" height="524" rx="2" fill="none" stroke="url(#bronze_gold)" stroke-width="0.8" opacity="0.4" />

  <!-- Roman Laurel Wreath Emblem -->
  <g transform="translate(205, 230)" fill="none" stroke="url(#bronze_gold)" stroke-width="2" opacity="0.85">
    <!-- Left Wreath Leaf Arc -->
    <path d="M-10,40 C-60,30 -70,-30 -30,-60 C-40,-30 -30,10 -10,40" fill="url(#bronze_gold)" opacity="0.8" />
    <!-- Right Wreath Leaf Arc -->
    <path d="M10,40 C60,30 70,-30 30,-60 C40,-30 30,10 10,40" fill="url(#bronze_gold)" opacity="0.8" />
    <!-- Central Stoic Pillar / Star -->
    <circle cx="0" cy="-65" r="4" fill="#F2D78A" />
    <path d="M-8,-15 L8,-15 L4,25 L-4,25 Z" fill="url(#bronze_gold)" />
  </g>

  <!-- Author Name -->
  <text x="205" y="105" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="13" fill="#F2D78A" letter-spacing="5" text-anchor="middle" font-weight="600">
    MARCUS AURELIUS
  </text>
  <line x1="130" y1="120" x2="280" y2="120" stroke="url(#bronze_gold)" stroke-width="1" opacity="0.6" />

  <!-- Book Title -->
  <text x="205" y="355" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="32" fill="#FFF8E1" letter-spacing="4" text-anchor="middle" font-weight="700">
    MEDITATIONS
  </text>

  <!-- Subtitle -->
  <text x="205" y="395" font-family="'Inter', sans-serif" font-size="10" fill="#CFC5B5" letter-spacing="3" text-anchor="middle" opacity="0.8">
    THOUGHTS OF A ROMAN EMPEROR
  </text>

  <!-- Bottom Tagline -->
  <line x1="160" y1="480" x2="250" y2="480" stroke="url(#bronze_gold)" stroke-width="1" opacity="0.5" />
  <text x="205" y="515" font-family="'Cinzel', 'Georgia', serif" font-size="9" fill="#F2D78A" letter-spacing="3" text-anchor="middle" opacity="0.8">
    THE IMMORTAL STOIC GUIDE
  </text>
</svg>
