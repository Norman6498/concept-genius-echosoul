<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg_ghalib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18111A" />
      <stop offset="50%" stop-color="#241728" />
      <stop offset="100%" stop-color="#0D080E" />
    </linearGradient>
    <linearGradient id="poetic_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="50%" stop-color="#F2D78A" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>
  </defs>

  <rect width="400" height="600" rx="12" fill="url(#bg_ghalib)" />
  <rect x="0" y="0" width="28" height="600" fill="#000000" opacity="0.35" />
  <rect x="42" y="30" width="326" height="540" rx="6" fill="none" stroke="url(#poetic_gold)" stroke-width="1.5" opacity="0.6" />

  <!-- Feather Quill & Ink Droplet Emblem -->
  <g transform="translate(205, 220)">
    <!-- Feather Curve -->
    <path d="M-15,50 C-10,10 10,-30 40,-60 C35,-35 25,-10 0,35 Z" fill="url(#poetic_gold)" opacity="0.85" />
    <!-- Quill Stem -->
    <path d="M-15,50 L-25,70 L-20,70 L-13,53 Z" fill="url(#poetic_gold)" />
    <!-- Ink Drop -->
    <circle cx="-25" cy="80" r="3" fill="#F2D78A" />
  </g>

  <!-- Author Name -->
  <text x="205" y="105" font-family="'Cinzel', 'Playfair Display', serif" font-size="14" fill="#F2D78A" letter-spacing="5" text-anchor="middle" font-weight="600">
    MIRZA GHALIB
  </text>
  <line x1="140" y1="120" x2="270" y2="120" stroke="url(#poetic_gold)" stroke-width="1" opacity="0.5" />

  <!-- Book Title -->
  <text x="205" y="340" font-family="'Playfair Display', serif" font-size="30" fill="#FFF8E1" letter-spacing="3" text-anchor="middle" font-weight="700">
    DIWAN-E-GHALIB
  </text>

  <!-- Subtitle -->
  <text x="205" y="380" font-family="'Inter', sans-serif" font-size="10" fill="#CFC5B5" letter-spacing="2" text-anchor="middle" opacity="0.8">
    SELECTED GHAZALS &amp; SHAYARI
  </text>

  <line x1="160" y1="480" x2="250" y2="480" stroke="url(#poetic_gold)" stroke-width="1" opacity="0.5" />
  <text x="205" y="515" font-family="'Cinzel', serif" font-size="9" fill="#F2D78A" letter-spacing="3" text-anchor="middle" opacity="0.8">
    IMMORTAL URDU POETRY
  </text>
</svg>
